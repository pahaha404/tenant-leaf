spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenant_leaf}
    username: ${POSTGRES_USER:tenant_leaf}
    password: ${POSTGRES_PASSWORD:tenant_leaf_local}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:tenant_leaf}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:tenant_leaf_minio_local}
    bucket: ${OBJECT_STORAGE_BUCKET:tenant-leaf-media}
    presign-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
