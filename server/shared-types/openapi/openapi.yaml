openapi: 3.0.3
info:
  title: Tenant Leaf API
  version: 2.0.0-draft.1
  x-contract-status: review-draft
  description: |
    세입세잎 Android 앱과 Kotlin API 서버가 공유하는 MVP HTTP API 계약의 2.0 검토 초안입니다.
    현장 점검은 체크리스트 대신 구역·관찰·근거 JPEG를 중심으로 처리합니다.
    원본 영상은 휴대전화 갤러리에만 보관하고 서버에는 업로드하지 않습니다.
    AI 결과는 실제 하자나 안전 상태를 확정하지 않는 확인 필요 관찰 후보입니다.
    이 명세에는 요청·응답 구조가 확정된 인증, 매물과 임장 생명주기 API만 포함합니다.
    Media, Observation과 Report HTTP API는 남은 P0 계약이 확정될 때까지 제외합니다.
servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버
tags:
  - name: Auth
    description: MVP 데모 로그인
  - name: Properties
    description: 매물 관리
  - name: Inspections
    description: 임장 생명주기 관리

security:
  - bearerAuth: []

paths:
  /auth/demo:
    post:
      tags: [Auth]
      summary: 데모 로그인
      description: 실제 소셜 계정 연동 없이 MVP 데모 사용자의 접근 토큰을 발급합니다.
      operationId: loginDemo
      security: []
      responses:
        "200":
          description: 데모 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoginResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties:
    post:
      tags: [Properties]
      summary: 매물 생성
      operationId: createProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
      responses:
        "201":
          description: 매물 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Properties]
      summary: 내 매물 목록 조회
      operationId: listProperties
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 매물 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties/{propertyId}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [Properties]
      summary: 매물 상세 조회
      operationId: getProperty
      responses:
        "200":
          description: 매물 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Properties]
      summary: 매물 수정
      description: 생략한 필드는 유지하고 명시적인 null은 선택값 삭제를 의미합니다.
      operationId: updateProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyRequest"
      responses:
        "200":
          description: 매물 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Properties]
      summary: 매물 삭제
      description: 현재 확정 범위는 하위 임장이 없는 매물의 삭제입니다. 임장이 존재할 때의 거부·보관·하위 데이터 처리 방식은 P0 합의 전까지 구현하거나 클라이언트가 가정하지 않습니다.
      operationId: deleteProperty
      responses:
        "204":
          description: 매물 삭제 성공
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties/{propertyId}/inspections:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      tags: [Inspections]
      summary: 새 임장 시작
      description: 사용자가 실제 영상 촬영을 시작할 때 IN_PROGRESS 임장을 생성합니다.
      operationId: createInspection
      responses:
        "201":
          description: 임장 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Inspections]
      summary: 매물의 임장 목록 조회
      operationId: listInspections
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 임장 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    get:
      tags: [Inspections]
      summary: 임장 상세 조회
      operationId: getInspection
      responses:
        "200":
          description: 임장 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}/status:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    patch:
      tags: [Inspections]
      summary: 임장 종료 또는 취소
      description: IN_PROGRESS 임장을 ENDED 또는 CANCELLED로 한 번만 전환합니다.
      operationId: updateInspectionStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionStatusRequest"
      responses:
        "200":
          description: 임장 상태 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-demo-token

  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        default: 20
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 요청값 형식 또는 범위 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: 로그인이 필요함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 요청한 리소스가 없거나 접근할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 현재 상태에서는 요청을 수행할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DemoLoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          minLength: 1
          example: issued-demo-access-token
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          example: 데모 사용자
        createdAt:
          type: string
          format: date-time

    CreatePropertyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 역세권 원룸
        addressSummary:
          type: string
          example: 서울시 ○○구
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          description: 사용자가 입력한 원(KRW) 단위 보증금입니다.
          example: 10000000
        monthlyRentAmount:
          type: integer
          format: int64
          minimum: 0
          description: 사용자가 입력한 원(KRW) 단위 월세입니다.
          example: 650000
        maintenanceFeeAmount:
          type: integer
          format: int64
          minimum: 0
          description: 사용자가 입력한 원(KRW) 단위 월 관리비입니다.
          example: 70000
        areaSquareMeters:
          type: number
          format: double
          minimum: 0.01
          description: 서버에 저장하는 제곱미터(㎡) 단위 전용면적입니다. 앱이 평 입력값을 1평=3.305785㎡ 기준으로 변환하여 전송합니다.
          example: 18.5
        floor:
          type: string
          minLength: 1
          description: 3층, 반지하, 옥탑처럼 사용자가 입력한 층 정보입니다.
          example: 2층
        options:
          type: array
          uniqueItems: true
          description: 사용자가 입력한 매물 포함 설비 목록입니다.
          items:
            type: string
            minLength: 1
          example: [에어컨, 냉장고, 세탁기]
        brokerContact:
          type: string
          minLength: 1
          description: 사용자가 입력한 중개업소 또는 중개인 연락 정보입니다.
          example: ○○부동산 02-0000-0000
        note:
          type: string
          example: 채광 확인 필요

    UpdatePropertyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        addressSummary:
          type: string
          nullable: true
          description: null이면 기존 주소 요약을 삭제합니다.
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 원(KRW) 단위이며 null이면 기존 값을 삭제합니다.
        monthlyRentAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 원(KRW) 단위이며 null이면 기존 값을 삭제합니다.
        maintenanceFeeAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 원(KRW) 단위이며 null이면 기존 값을 삭제합니다.
        areaSquareMeters:
          type: number
          format: double
          minimum: 0.01
          nullable: true
          description: 서버 기준인 ㎡ 단위이며 null이면 기존 값을 삭제합니다. 평 단위 전환은 앱에서 수행합니다.
        floor:
          type: string
          minLength: 1
          nullable: true
          description: null이면 기존 층 정보를 삭제합니다.
        options:
          type: array
          uniqueItems: true
          nullable: true
          description: null이면 기존 옵션 목록을 삭제합니다.
          items:
            type: string
            minLength: 1
        brokerContact:
          type: string
          minLength: 1
          nullable: true
          description: null이면 기존 부동산 연락처를 삭제합니다.
        note:
          type: string
          nullable: true
          description: null이면 기존 메모를 삭제합니다.

    Property:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        addressSummary:
          type: string
          nullable: true
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 사용자가 입력한 원(KRW) 단위 보증금입니다.
        monthlyRentAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 사용자가 입력한 원(KRW) 단위 월세입니다.
        maintenanceFeeAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 사용자가 입력한 원(KRW) 단위 월 관리비입니다.
        areaSquareMeters:
          type: number
          format: double
          minimum: 0.01
          nullable: true
          description: 서버에 저장된 제곱미터(㎡) 단위 전용면적입니다. 앱은 1평=3.305785㎡ 기준으로 평 표시를 계산합니다.
        floor:
          type: string
          minLength: 1
          nullable: true
        options:
          type: array
          uniqueItems: true
          nullable: true
          items:
            type: string
            minLength: 1
        brokerContact:
          type: string
          minLength: 1
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PropertyPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Property"

    InspectionStatus:
      type: string
      enum: [IN_PROGRESS, ENDED, CANCELLED]

    InspectionAnalysisStatus:
      type: string
      description: 서버가 등록 미디어의 업로드·분석 상태와 미디어 집합 확정 여부에서 계산하는 임장 전체 분석 상태입니다. UPLOADING은 등록, PENDING, 업로드, 객체 확인, 재시도와 집합 미확정 상태에서 최종 실패만 남은 경우를 포함합니다. QUEUED는 분석 요청 준비 또는 대기열 처리 중을 뜻하며 UPLOADED이면서 NOT_REQUESTED인 미디어도 포함합니다. COMPLETED와 FAILED는 미디어 집합 확정 후에만 반환합니다.
      enum: [NOT_STARTED, UPLOADING, QUEUED, ANALYZING, PARTIAL_COMPLETED, COMPLETED, FAILED]

    Inspection:
      type: object
      required: [id, propertyId, status, analysisStatus, startedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InspectionStatus"
        analysisStatus:
          allOf:
            - $ref: "#/components/schemas/InspectionAnalysisStatus"
          readOnly: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: 목록 보관 시각이며 임장 상태값이 아닙니다.
        createdAt:
          type: string
          format: date-time
    InspectionPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Inspection"

    UpdateInspectionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: IN_PROGRESS 임장은 ENDED 또는 CANCELLED로만 변경할 수 있습니다.
          enum: [ENDED, CANCELLED]

    Zone:
      type: string
      enum: [ENTRANCE_COMMON, KITCHEN, WINDOW_VENTILATION, LIVING_ROOM, BATHROOM, UNKNOWN]

    MediaType:
      type: string
      enum: [PHOTO]

    CaptureSource:
      type: string
      enum: [META_GLASS, ANDROID_CAMERA]

    FrameOrigin:
      type: string
      description: 촬영 후 추출이 MVP 기본값이며 촬영 중 생성은 실기기 검증 후에만 사용합니다.
      enum: [DURING_RECORDING_CAPTURE, POST_RECORDING_EXTRACTION]

    MediaUploadStatus:
      type: string
      enum: [PENDING, UPLOADING, UPLOADED, FAILED]

    MediaAnalysisStatus:
      type: string
      enum: [NOT_REQUESTED, QUEUED, ANALYZING, COMPLETED, FAILED]

    ZoneAnalysisStatus:
      type: string
      enum: [NO_MEDIA, UPLOADING, QUEUED, ANALYZING, COMPLETED, PARTIAL_FAILED, FAILED]

    ObservationStatus:
      type: string
      description: DISMISSED는 하자 아님이나 오탐 확정이 아니라 기본 리포트 제외 상태입니다.
      enum: [ACTIVE, VIEWED, DISMISSED]

    ReportStatus:
      type: string
      enum: [NOT_REQUESTED, WAITING_FOR_ANALYSIS, GENERATING, COMPLETED, PARTIAL_COMPLETED, FAILED]

    AiLabel:
      type: string
      description: 모델 클래스 ID 0~12와 고정 쌍으로 사용하는 원본 영문 라벨입니다.
      enum:
        - crack
        - mold
        - peeling
        - waterdamage
        - tiledamage
        - hole
        - tilecrack
        - paintdrips
        - pinhole
        - surfacedefect
        - stain
        - trowelmark
        - other

    Bbox:
      type: object
      required: [x, y, width, height]
      description: 이미지 왼쪽 위를 원점으로 하는 0.0~1.0 정규화 좌표입니다.
      properties:
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
        width:
          type: number
          format: double
          minimum: 0
          maximum: 1
        height:
          type: number
          format: double
          minimum: 0
          maximum: 1

    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
