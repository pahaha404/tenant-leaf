spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenant_leaf}
    username: ${POSTGRES_USER:tenant_leaf}
    password: ${POSTGRES_PASSWORD:tenant_leaf_local}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
