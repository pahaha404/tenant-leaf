services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenant_leaf}
      POSTGRES_USER: ${POSTGRES_USER:-tenant_leaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenant_leaf_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tenant_leaf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tenant_leaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tenant_leaf_minio_local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tenant_leaf_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  tenant_leaf_postgres_data:
    name: tenant-leaf-postgres-data
  tenant_leaf_minio_data:
    name: tenant-leaf-minio-data
