spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/tenant_leaf_test}
    username: ${POSTGRES_USER:tenant_leaf}
    password: ${POSTGRES_PASSWORD:tenant_leaf_local}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: tenant_leaf_test
    schemas: tenant_leaf_test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tenant_leaf_test
    open-in-view: false
# Tests load this file instead of the main application.yml. Keep storage
# credentials explicit so MinIO client beans can be created in CI before the
# fake ObjectStorageGateway supplied by media tests takes effect.
app:
  report:
    # Repository integration tests invoke the coordinator explicitly when needed.
    reconcile-initial-delay-ms: 3600000
  object-storage:
    access-key: tenant_leaf_test
    secret-key: tenant_leaf_test_secret
