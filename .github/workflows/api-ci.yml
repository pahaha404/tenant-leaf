name: API CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - server/api/**
      - server/shared-types/openapi/**
      - server/infra/docker/**
      - .env.example
      - .github/workflows/api-ci.yml
  push:
    branches:
      - develop
      - main
    paths:
      - server/api/**
      - server/shared-types/openapi/**
      - server/infra/docker/**
      - .env.example
      - .github/workflows/api-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tenant_leaf_test
          POSTGRES_USER: tenant_leaf
          POSTGRES_PASSWORD: tenant_leaf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenant_leaf -d tenant_leaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/tenant_leaf_test
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/tenant_leaf_test
      POSTGRES_USER: tenant_leaf
      POSTGRES_PASSWORD: tenant_leaf_ci

    defaults:
      run:
        working-directory: server/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            server/api/*.gradle.kts
            server/api/gradle/wrapper/gradle-wrapper.properties
            server/shared-types/openapi/openapi.yaml

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Validate OpenAPI contract
        run: ./gradlew openApiValidate --no-daemon

      - name: Build and test
        run: ./gradlew clean test --no-daemon
