openapi: 3.0.3
info:
  title: Tenant Leaf API
  version: 2.2.0-draft.1
  x-contract-status: review-draft
  description: |
    세입세잎 Android 앱과 Kotlin API 서버가 공유하는 MVP HTTP API 계약의 2.2 검토 초안입니다.
    현장 점검은 체크리스트 대신 구역·관찰·근거 JPEG를 중심으로 처리합니다.
    원본 영상은 휴대전화 갤러리에만 보관하고 서버에는 업로드하지 않습니다.
    AI 결과는 실제 하자나 안전 상태를 확정하지 않는 확인 필요 관찰 후보입니다.
    이 명세에는 인증, 매물, 임장, JPEG 업로드·집합 확정, 관찰 조회·검토와 자동 리포트 조회 API를 포함합니다.
servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버
tags:
  - name: Auth
    description: MVP 데모 로그인
  - name: Properties
    description: 매물 관리
  - name: Inspections
    description: 임장 진행 상태 관리
  - name: Media
    description: 분석용 JPEG 등록, 직접 업로드 확인, 재시도와 조회
  - name: Observations
    description: AI가 생성한 확인 필요 관찰과 사용자 검토 상태
  - name: Reports
    description: 미디어 분석 종료 후 자동 생성되는 규칙 기반 리포트

security:
  - bearerAuth: []

paths:
  /auth/demo:
    post:
      tags: [Auth]
      summary: 데모 로그인
      description: 실제 소셜 계정 연동 없이 MVP 데모 사용자의 접근 토큰을 발급합니다.
      operationId: loginDemo
      security: []
      responses:
        "200":
          description: 데모 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoginResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties:
    post:
      tags: [Properties]
      summary: 매물 생성
      operationId: createProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
      responses:
        "201":
          description: 매물 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Properties]
      summary: 내 매물 목록 조회
      operationId: listProperties
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 매물 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties/{propertyId}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [Properties]
      summary: 매물 상세 조회
      operationId: getProperty
      responses:
        "200":
          description: 매물 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Properties]
      summary: 매물 수정
      description: 생략한 필드는 유지하고 명시적인 null은 선택값 삭제를 의미합니다.
      operationId: updateProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyRequest"
      responses:
        "200":
          description: 매물 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Properties]
      summary: 매물 삭제
      description: 현재 확정 범위는 하위 임장이 없는 매물의 삭제입니다. 임장이 존재할 때의 거부·보관·하위 데이터 처리 방식은 P0 합의 전까지 구현하거나 클라이언트가 가정하지 않습니다.
      operationId: deleteProperty
      responses:
        "204":
          description: 매물 삭제 성공
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties/{propertyId}/inspections:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      tags: [Inspections]
      summary: 새 임장 시작
      description: 사용자가 실제 영상 촬영을 시작할 때 IN_PROGRESS 임장을 생성합니다.
      operationId: createInspection
      responses:
        "201":
          description: 임장 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Inspections]
      summary: 매물의 임장 목록 조회
      operationId: listInspections
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 임장 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    get:
      tags: [Inspections]
      summary: 임장 상세 조회
      operationId: getInspection
      responses:
        "200":
          description: 임장 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}/status:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    patch:
      tags: [Inspections]
      summary: 임장 종료 또는 취소
      description: IN_PROGRESS 임장을 ENDED 또는 CANCELLED로 한 번만 전환합니다.
      operationId: updateInspectionStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionStatusRequest"
      responses:
        "200":
          description: 임장 상태 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}/media/upload-requests:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    post:
      tags: [Media]
      summary: JPEG 미디어 배치 등록 및 업로드 URL 발급
      description: |
        ENDED 임장에 1~20장의 JPEG 메타데이터를 등록합니다. 20장은 요청 한 번의 묶음 한도이며
        임장 전체 한도가 아닙니다. 배치는 원자적으로 검증하며 각 항목에 15분 동안 유효한 객체 저장소
        직접 업로드 URL을 발급합니다. 같은 clientMediaId와 같은 메타데이터는 기존 미디어를 재사용하고,
        다른 메타데이터면 CLIENT_MEDIA_ID_CONFLICT로 거부합니다.
      operationId: createMediaUploadRequests
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaUploadBatchRequest"
      responses:
        "201":
          description: 미디어 등록 및 업로드 URL 발급 성공. 같은 멱등 요청에는 기존 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMediaUploadBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /inspections/{inspectionId}/media:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    get:
      tags: [Media]
      summary: 임장 미디어 목록 조회
      operationId: listInspectionMedia
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 임장 미디어 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      tags: [Media]
      summary: 미디어 상세 조회
      operationId: getMedia
      responses:
        "200":
          description: 미디어 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /media/{mediaId}/upload-complete:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    post:
      tags: [Media]
      summary: JPEG 업로드 완료 확인
      description: 객체 존재, 실제 JPEG 형식과 최대 2MiB 크기를 검증한 뒤 UPLOADED로 확정합니다.
      operationId: completeMediaUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 업로드 완료 확인 성공. 반복된 동일 요청에는 기존 미디어를 반환합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /media/{mediaId}/upload-retry:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    post:
      tags: [Media]
      summary: JPEG 업로드 URL 재발급
      description: 같은 mediaId, clientMediaId와 저장소 키를 유지하면서 새 15분 유효 업로드 URL을 발급합니다.
      operationId: retryMediaUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 업로드 URL 재발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadInstruction"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /inspections/{inspectionId}/media/finalize:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    post:
      tags: [Media]
      summary: 분석 대상 미디어 집합 확정
      description: |
        ENDED 임장의 삭제되지 않은 등록 미디어 수를 expectedMediaCount와 비교하고 mediaFinalizedAt을 기록합니다.
        확정 후 신규 미디어 등록은 MEDIA_SET_FINALIZED로 거부하며 기존 실패 미디어 재시도는 허용합니다.
      operationId: finalizeInspectionMedia
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeInspectionMediaRequest"
      responses:
        "200":
          description: 미디어 집합 확정 성공 또는 동일 멱등 요청 재응답
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeInspectionMediaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}/observations:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    get:
      tags: [Observations]
      summary: 임장의 확인 필요 관찰 목록 조회
      operationId: listInspectionObservations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 관찰 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /observations/{observationId}:
    parameters:
      - $ref: "#/components/parameters/ObservationId"
    get:
      tags: [Observations]
      summary: 확인 필요 관찰 상세 조회
      operationId: getObservation
      responses:
        "200":
          description: 관찰 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /observations/{observationId}/status:
    parameters:
      - $ref: "#/components/parameters/ObservationId"
    patch:
      tags: [Observations]
      summary: 관찰 검토 상태 변경
      description: AI 원본 결과는 유지하며 VIEWED 또는 DISMISSED로 변경합니다. DISMISSED 복원 값은 VIEWED입니다.
      operationId: updateObservationStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObservationStatusRequest"
      responses:
        "200":
          description: 관찰 상태 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /properties/{propertyId}/reports:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [Reports]
      summary: 매물의 리포트 목록 조회
      operationId: listPropertyReports
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 리포트 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /inspections/{inspectionId}/report:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    get:
      tags: [Reports]
      summary: 임장 자동 리포트 조회
      description: 미디어 집합 확정 전에는 리포트가 없을 수 있으며, 생성이 시작된 뒤에는 현재 상태와 사용 가능한 내용을 반환합니다.
      operationId: getInspectionReport
      responses:
        "200":
          description: 리포트 상태 또는 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-demo-token

  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        default: 20
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObservationId:
      name: observationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 논리 요청의 재전송에도 유지하는 UUID 문자열입니다.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 요청값 형식 또는 범위 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: 로그인이 필요함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 요청한 리소스가 없거나 접근할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 현재 상태에서는 요청을 수행할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FileTooLarge:
      description: JPEG가 사진당 최대 2,097,152 bytes를 초과함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: 실제 파일 형식 또는 Content-Type이 image/jpeg가 아님
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: 객체 저장소에 일시적으로 연결할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DemoLoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          minLength: 1
          example: issued-demo-access-token
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          example: 데모 사용자
        createdAt:
          type: string
          format: date-time

    CreatePropertyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 역세권 원룸
        addressSummary:
          type: string
          example: 서울시 ○○구
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          description: 사용자가 입력한 원(KRW) 단위 보증금입니다.
          example: 10000000
        monthlyRentAmount:
          type: integer
          format: int64
          minimum: 0
          description: 사용자가 입력한 원(KRW) 단위 월세입니다.
          example: 650000
        maintenanceFeeAmount:
          type: integer
          format: int64
          minimum: 0
          description: 사용자가 입력한 원(KRW) 단위 월 관리비입니다.
          example: 70000
        areaSquareMeters:
          type: number
          format: double
          minimum: 0.01
          description: 서버에 저장하는 제곱미터(㎡) 단위 전용면적입니다. 앱이 평 입력값을 1평=3.305785㎡ 기준으로 변환하여 전송합니다.
          example: 18.5
        floor:
          type: string
          minLength: 1
          description: 3층, 반지하, 옥탑처럼 사용자가 입력한 층 정보입니다.
          example: 2층
        options:
          type: array
          uniqueItems: true
          description: 사용자가 입력한 매물 포함 설비 목록입니다.
          items:
            type: string
            minLength: 1
          example: [에어컨, 냉장고, 세탁기]
        brokerContact:
          type: string
          minLength: 1
          description: 사용자가 입력한 중개업소 또는 중개인 연락 정보입니다.
          example: ○○부동산 02-0000-0000
        note:
          type: string
          example: 채광 확인 필요

    UpdatePropertyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        addressSummary:
          type: string
          nullable: true
          description: null이면 기존 주소 요약을 삭제합니다.
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 원(KRW) 단위이며 null이면 기존 값을 삭제합니다.
        monthlyRentAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 원(KRW) 단위이며 null이면 기존 값을 삭제합니다.
        maintenanceFeeAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 원(KRW) 단위이며 null이면 기존 값을 삭제합니다.
        areaSquareMeters:
          type: number
          format: double
          minimum: 0.01
          nullable: true
          description: 서버 기준인 ㎡ 단위이며 null이면 기존 값을 삭제합니다. 평 단위 전환은 앱에서 수행합니다.
        floor:
          type: string
          minLength: 1
          nullable: true
          description: null이면 기존 층 정보를 삭제합니다.
        options:
          type: array
          uniqueItems: true
          nullable: true
          description: null이면 기존 옵션 목록을 삭제합니다.
          items:
            type: string
            minLength: 1
        brokerContact:
          type: string
          minLength: 1
          nullable: true
          description: null이면 기존 부동산 연락처를 삭제합니다.
        note:
          type: string
          nullable: true
          description: null이면 기존 메모를 삭제합니다.

    Property:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        addressSummary:
          type: string
          nullable: true
        depositAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 사용자가 입력한 원(KRW) 단위 보증금입니다.
        monthlyRentAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 사용자가 입력한 원(KRW) 단위 월세입니다.
        maintenanceFeeAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 사용자가 입력한 원(KRW) 단위 월 관리비입니다.
        areaSquareMeters:
          type: number
          format: double
          minimum: 0.01
          nullable: true
          description: 서버에 저장된 제곱미터(㎡) 단위 전용면적입니다. 앱은 1평=3.305785㎡ 기준으로 평 표시를 계산합니다.
        floor:
          type: string
          minLength: 1
          nullable: true
        options:
          type: array
          uniqueItems: true
          nullable: true
          items:
            type: string
            minLength: 1
        brokerContact:
          type: string
          minLength: 1
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PropertyPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Property"

    InspectionStatus:
      type: string
      enum: [IN_PROGRESS, ENDED, CANCELLED]

    InspectionAnalysisStatus:
      type: string
      description: 서버가 등록 미디어의 업로드·분석 상태와 미디어 집합 확정 여부에서 계산하는 임장 전체 분석 상태입니다. UPLOADING은 등록, PENDING, 업로드, 객체 확인, 재시도와 집합 미확정 상태에서 최종 실패만 남은 경우를 포함합니다. QUEUED는 분석 요청 준비 또는 대기열 처리 중을 뜻하며 UPLOADED이면서 NOT_REQUESTED인 미디어도 포함합니다. COMPLETED와 FAILED는 미디어 집합 확정 후에만 반환합니다.
      enum: [NOT_STARTED, UPLOADING, QUEUED, ANALYZING, PARTIAL_COMPLETED, COMPLETED, FAILED]

    Inspection:
      type: object
      required: [id, propertyId, status, analysisStatus, startedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InspectionStatus"
        analysisStatus:
          allOf:
            - $ref: "#/components/schemas/InspectionAnalysisStatus"
          readOnly: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: 목록 보관 시각이며 임장 상태값이 아닙니다.
        mediaFinalizedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 분석 대상 미디어 집합을 확정한 시각입니다.
        expectedMediaCount:
          type: integer
          minimum: 0
          nullable: true
          readOnly: true
          description: 미디어 집합 확정 요청에서 검증한 분석 대상 수입니다.
        createdAt:
          type: string
          format: date-time
    InspectionPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Inspection"

    UpdateInspectionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: IN_PROGRESS 임장은 ENDED 또는 CANCELLED로만 변경할 수 있습니다.
          enum: [ENDED, CANCELLED]

    CreateMediaUploadBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: 요청 한 번의 등록 묶음입니다. 임장 전체 미디어 한도가 아닙니다.
          items:
            $ref: "#/components/schemas/CreateMediaUploadRequest"

    CreateMediaUploadRequest:
      type: object
      required:
        - clientMediaId
        - contentType
        - fileSize
        - width
        - height
        - sourceVideoId
        - sourceVideoOffsetMs
        - frameOrigin
        - captureSource
        - capturedAt
      properties:
        clientMediaId:
          type: string
          format: uuid
          description: 같은 논리 사진의 재시도에도 유지하는 Android 생성 UUID입니다.
        contentType:
          type: string
          enum: [image/jpeg]
        fileSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
          description: Android가 등록 시 선언한 JPEG 바이트 크기이며 완료 시 객체와 대조합니다.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sourceVideoId:
          type: string
          format: uuid
          description: 원본 영상을 찾을 수 없는 Android 로컬 클립 식별자입니다.
        sourceVideoOffsetMs:
          type: integer
          format: int64
          minimum: 0
        frameOrigin:
          type: string
          enum: [POST_RECORDING_EXTRACTION]
          description: MVP 업로드 보장 경로는 촬영 후 영상 프레임 추출입니다.
        captureSource:
          $ref: "#/components/schemas/CaptureSource"
        capturedAt:
          type: string
          format: date-time

    CreateMediaUploadBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/MediaUploadInstruction"

    MediaUploadInstruction:
      type: object
      required: [mediaId, clientMediaId, uploadUrl, expiresAt, uploadStatus]
      properties:
        mediaId:
          type: string
          format: uuid
        clientMediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Content-Type image/jpeg로 직접 PUT하는 15분 유효 서명 URL입니다. 로그나 영구 저장소에 남기지 않습니다.
        expiresAt:
          type: string
          format: date-time
        uploadStatus:
          type: string
          enum: [PENDING]

    Media:
      type: object
      required:
        - id
        - clientMediaId
        - inspectionId
        - mediaType
        - contentType
        - fileSize
        - width
        - height
        - sourceVideoId
        - sourceVideoOffsetMs
        - frameOrigin
        - captureSource
        - capturedAt
        - uploadStatus
        - analysisStatus
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        clientMediaId:
          type: string
          format: uuid
        inspectionId:
          type: string
          format: uuid
        mediaType:
          $ref: "#/components/schemas/MediaType"
        zone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
          readOnly: true
          description: 사용자 보정값이 있으면 이를 우선하고, 없으면 aiZone을 사용하는 유효 구역입니다. 분석 전에는 null일 수 있습니다.
        aiZone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
          readOnly: true
          description: AI 구역 분류 원본입니다. 불확실·실패·미지원 결과는 UNKNOWN입니다.
        zoneConfidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          readOnly: true
        zoneUncertain:
          type: boolean
          nullable: true
          readOnly: true
        zoneModelVersion:
          type: string
          nullable: true
          readOnly: true
        userCorrectedZone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
          readOnly: true
        correctedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        contentType:
          type: string
          enum: [image/jpeg]
        fileSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sourceVideoId:
          type: string
          format: uuid
        sourceVideoOffsetMs:
          type: integer
          format: int64
          minimum: 0
        frameOrigin:
          $ref: "#/components/schemas/FrameOrigin"
        captureSource:
          $ref: "#/components/schemas/CaptureSource"
        capturedAt:
          type: string
          format: date-time
        uploadStatus:
          $ref: "#/components/schemas/MediaUploadStatus"
        analysisStatus:
          $ref: "#/components/schemas/MediaAnalysisStatus"
        createdAt:
          type: string
          format: date-time

    MediaPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Media"

    FinalizeInspectionMediaRequest:
      type: object
      required: [expectedMediaCount]
      properties:
        expectedMediaCount:
          type: integer
          minimum: 0
          description: Android가 등록을 마친 삭제되지 않은 분석 대상 미디어 수입니다.

    FinalizeInspectionMediaResponse:
      type: object
      required: [inspectionId, expectedMediaCount, registeredMediaCount, mediaFinalizedAt, analysisStatus]
      properties:
        inspectionId:
          type: string
          format: uuid
        expectedMediaCount:
          type: integer
          minimum: 0
        registeredMediaCount:
          type: integer
          minimum: 0
        mediaFinalizedAt:
          type: string
          format: date-time
        analysisStatus:
          $ref: "#/components/schemas/InspectionAnalysisStatus"

    ObservationType:
      type: string
      description: AI classId 0~12와 순서대로 1:1 변환되는 비확정 확인 필요 관찰 유형입니다.
      enum:
        - CRACK_CHECK_NEEDED
        - MOLD_CHECK_NEEDED
        - PEELING_CHECK_NEEDED
        - WATER_DAMAGE_CHECK_NEEDED
        - TILE_DAMAGE_CHECK_NEEDED
        - HOLE_CHECK_NEEDED
        - TILE_CRACK_CHECK_NEEDED
        - PAINT_DRIPS_CHECK_NEEDED
        - PINHOLE_CHECK_NEEDED
        - SURFACE_DEFECT_CHECK_NEEDED
        - STAIN_CHECK_NEEDED
        - TROWEL_MARK_CHECK_NEEDED
        - OTHER_CHECK_NEEDED

    ImageDimensions:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    BboxCoordinateSystem:
      type: string
      enum: [PIXEL_XYXY]

    EvidenceDetection:
      type: object
      required: [observationId, classId, label, displayLabel, displayColor, confidence, box]
      properties:
        observationId:
          type: string
          format: uuid
        classId:
          type: integer
          minimum: 0
          maximum: 12
        label:
          $ref: "#/components/schemas/AiLabel"
        displayLabel:
          type: string
          minLength: 1
        displayColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        box:
          $ref: "#/components/schemas/Bbox"

    ObservationEvidence:
      type: object
      required: [mediaId, primary, available, sourceVideoOffsetMs, image, coordinateSystem, detections]
      properties:
        mediaId:
          type: string
          format: uuid
        primary:
          type: boolean
          description: 관찰의 대표 근거이면 true입니다. 관찰마다 정확히 하나만 true입니다.
        available:
          type: boolean
          description: 보관 정책상 근거 JPEG를 현재 조회할 수 있는지 나타냅니다.
        sourceVideoOffsetMs:
          type: integer
          format: int64
          minimum: 0
        image:
          $ref: "#/components/schemas/ImageDimensions"
        coordinateSystem:
          $ref: "#/components/schemas/BboxCoordinateSystem"
        detections:
          type: array
          minItems: 1
          description: 같은 근거 JPEG에서 사용자 표시 임계값을 통과한 관찰 bbox입니다. 현재 관찰의 observationId와 일치하는 항목을 기본 강조합니다.
          items:
            $ref: "#/components/schemas/EvidenceDetection"
        viewUrl:
          type: string
          format: uri
          nullable: true
          description: 권한 확인 후 발급하는 짧은 만료 시간의 서명 조회 URL입니다.
        viewUrlExpiresAt:
          type: string
          format: date-time
          nullable: true

    Observation:
      type: object
      required:
        - id
        - inspectionId
        - type
        - zone
        - aiZone
        - zoneConfidence
        - zoneUncertain
        - zoneModelVersion
        - title
        - description
        - confidence
        - observationMinConfidence
        - status
        - aiClassId
        - aiLabel
        - modelVersion
        - evidence
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        inspectionId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ObservationType"
        zone:
          $ref: "#/components/schemas/Zone"
        aiZone:
          $ref: "#/components/schemas/Zone"
        zoneConfidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        zoneUncertain:
          type: boolean
        zoneModelVersion:
          type: string
          nullable: true
        userCorrectedZone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
        correctedAt:
          type: string
          format: date-time
          nullable: true
        title:
          type: string
          minLength: 1
          description: 하자를 확정하지 않는 규칙 기반 사용자 표시 제목입니다.
          example: 균열로 추정되는 흔적 확인 필요
        description:
          type: string
          minLength: 1
          description: 계약·안전·수리 필요를 단정하지 않는 규칙 기반 설명입니다.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 원시 모델 신뢰도이며 위험도 또는 확률 보증이 아닙니다.
        observationMinConfidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 이 관찰 생성 당시 모델 버전·classId 설정에서 적용한 임계값입니다.
        status:
          $ref: "#/components/schemas/ObservationStatus"
        aiClassId:
          type: integer
          minimum: 0
          maximum: 12
        aiLabel:
          $ref: "#/components/schemas/AiLabel"
        modelVersion:
          type: string
          minLength: 1
        evidence:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ObservationEvidence"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ObservationPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Observation"

    UpdateObservationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [VIEWED, DISMISSED]
          description: DISMISSED 관찰의 복원 요청은 VIEWED를 사용합니다.

    ReportFailureCode:
      type: string
      enum: [NO_ANALYZABLE_MEDIA, GENERATION_FAILED]

    ReportSummary:
      type: object
      required:
        - id
        - propertyId
        - inspectionId
        - status
        - totalMediaCount
        - successfulMediaCount
        - failedMediaCount
        - observationCount
        - propertyDisplayName
        - inspectionEndedAt
        - scoreIsProvisional
        - templateVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        inspectionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ReportStatus"
        totalMediaCount:
          type: integer
          minimum: 0
          description: 미디어 집합 확정 시 서버가 기록한 전체 분석 대상 JPEG 수입니다.
        successfulMediaCount:
          type: integer
          minimum: 0
        failedMediaCount:
          type: integer
          minimum: 0
        observationCount:
          type: integer
          minimum: 0
          description: DISMISSED 관찰을 제외한 기본 리포트 관찰 수입니다.
        propertyDisplayName:
          type: string
          minLength: 1
        inspectionEndedAt:
          type: string
          format: date-time
        referenceScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: 확인 필요 관찰 1건당 5점을 차감한 참고값이며 안전·계약 점수가 아닙니다.
        scorePolicyVersion:
          type: string
          nullable: true
        scoreIsProvisional:
          type: boolean
          description: 일부 사진 분석 실패로 점수가 잠정값이면 true입니다.
        failureCode:
          allOf:
            - $ref: "#/components/schemas/ReportFailureCode"
          nullable: true
        templateVersion:
          type: string
          minLength: 1
          description: 자유 생성 LLM이 아닌 규칙·문장 템플릿 버전입니다.
        generatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReportDetail:
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          required: [observations]
          properties:
            emptyObservationMessage:
              type: string
              nullable: true
              description: 관찰 0건 성공 시 '현재 촬영 근거에서 확인 필요 관찰이 생성되지 않았습니다.'를 제공합니다.
            observations:
              type: array
              description: DISMISSED 관찰은 제외하며 각 항목의 근거 mediaId로 문장을 추적할 수 있습니다.
              items:
                $ref: "#/components/schemas/Observation"

    ReportPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReportSummary"

    Zone:
      type: string
      enum: [ENTRANCE_COMMON, KITCHEN, WINDOW_VENTILATION, LIVING_ROOM, BATHROOM, UNKNOWN]

    MediaType:
      type: string
      enum: [PHOTO]

    CaptureSource:
      type: string
      enum: [META_GLASS, ANDROID_CAMERA]

    FrameOrigin:
      type: string
      description: 촬영 후 추출이 MVP 기본값이며 촬영 중 생성은 실기기 검증 후에만 사용합니다.
      enum: [DURING_RECORDING_CAPTURE, POST_RECORDING_EXTRACTION]

    MediaUploadStatus:
      type: string
      enum: [PENDING, UPLOADING, UPLOADED, FAILED]

    MediaAnalysisStatus:
      type: string
      enum: [NOT_REQUESTED, QUEUED, ANALYZING, COMPLETED, FAILED]

    ZoneAnalysisStatus:
      type: string
      enum: [NO_MEDIA, UPLOADING, QUEUED, ANALYZING, COMPLETED, PARTIAL_FAILED, FAILED]

    ObservationStatus:
      type: string
      description: DISMISSED는 하자 아님이나 오탐 확정이 아니라 기본 리포트 제외 상태입니다.
      enum: [ACTIVE, VIEWED, DISMISSED]

    ReportStatus:
      type: string
      enum: [NOT_REQUESTED, WAITING_FOR_ANALYSIS, GENERATING, COMPLETED, PARTIAL_COMPLETED, FAILED]

    AiLabel:
      type: string
      description: 모델 클래스 ID 0~12와 고정 쌍으로 사용하는 원본 영문 라벨입니다.
      enum:
        - crack
        - mold
        - peeling
        - waterdamage
        - tiledamage
        - hole
        - tilecrack
        - paintdrips
        - pinhole
        - surfacedefect
        - stain
        - trowelmark
        - other

    Bbox:
      type: object
      required: [left, top, right, bottom]
      description: EXIF 방향 정규화가 끝난 원본 전체 JPEG의 왼쪽 위를 원점으로 하는 픽셀 xyxy 좌표입니다.
      properties:
        left:
          type: number
          format: double
          minimum: 0
        top:
          type: number
          format: double
          minimum: 0
        right:
          type: number
          format: double
          minimum: 0
        bottom:
          type: number
          format: double
          minimum: 0

    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 요청값을 확인해 주세요.
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        traceId:
          type: string
          minLength: 1
          example: 7ccf5b3f44d94fa0
