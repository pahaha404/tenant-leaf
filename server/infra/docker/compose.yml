services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenant_leaf}
      POSTGRES_USER: ${POSTGRES_USER:-tenant_leaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenant_leaf_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tenant_leaf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  tenant_leaf_postgres_data:
    name: tenant-leaf-postgres-data
