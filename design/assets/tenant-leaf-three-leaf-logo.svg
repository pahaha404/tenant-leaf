<?xml version="1.0" encoding="UTF-8"?>
<!--
  세입세잎 3잎 새싹 로고
  단색 버전: 브랜드 딥 그린 #165338
  viewBox를 유지해 SVG, 앱 아이콘, 웹에서 자유롭게 확대해 사용할 수 있습니다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">세입세잎 세 장 새싹 로고</title>
  <desc id="desc">한 줄기에서 왼쪽, 오른쪽, 위쪽으로 세 장의 잎이 자라는 새싹</desc>
  <g fill="#165338">
    <!-- 왼쪽 잎 -->
    <path d="M116.2 126.1C81.8 132.6 51.6 112.8 45 79.7c34.4-6.6 64.6 13.2 71.2 46.4Z"/>
    <!-- 오른쪽 잎 -->
    <path d="M139.8 112.4c6.6-34.4 36.8-54.2 71.2-47.6-6.6 34.4-36.8 54.2-71.2 47.6Z"/>
    <!-- 위쪽 잎 -->
    <path d="M127.7 101.7C103.4 76.6 104.1 37.9 129.1 13c24.4 25.1 23.7 63.7-1.4 88.7Z"/>
    <!-- 줄기: 잎을 연결하는 부드러운 곡선 -->
    <path d="M119.2 119.1c-4.2 18.5-1.1 34.1 9.2 48.1 9.3 12.7 12.3 29.3 8.5 45.9l-5.7 24.9h18.9l5-21.8c5.2-22.9.7-45.8-12.5-63.8-7.1-9.6-9.3-20.6-6.8-35.3l3.7-21.4-18.6 3.3-1.7 20.1Z"/>
    <!-- 땅: 작은 크기에서도 또렷하게 보이는 둥근 받침 -->
    <rect x="42" y="222" width="172" height="19" rx="9.5"/>
  </g>
</svg>
